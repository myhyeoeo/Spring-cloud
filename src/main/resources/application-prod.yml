server:
  port: 8080

spring:
  config:
    import: aws-parameterstore:/ch4/prod/
  cloud:
    aws:
      region:
        static: ap-northeast-2
      s3:
        bucket: ch4-myhyeoeo-files
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

info:
  team-name: ${TEAM_NAME}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  info:
    env:
      enabled: true