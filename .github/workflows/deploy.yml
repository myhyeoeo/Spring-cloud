name: CI/CD Pipeline

# main 브랜치 push 또는 PR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OIDC 토큰 요청 권한
permissions:
  id-token: write   # OIDC 토큰 요청용
  contents: read    # 코드 체크아웃용

jobs:
  # ========== CI: 테스트 → 빌드 → ECR push ==========
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}   # deploy job에 이미지 태그 전달

    steps:
      # Step 1: 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 2: 커밋 해시 앞 7자리 추출 (이미지 태그로 사용)
      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Step 3: Java 17 설치
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      # Step 4: Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 5: 테스트 실행
      - name: Run tests
        run: ./gradlew test

      # Step 6: JAR 빌드
      - name: Build JAR
        run: ./gradlew bootJar

      # Step 7: AWS 자격증명 - OIDC (main push일 때만)
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 8: ECR 로그인
      - name: Login to ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      # Step 9: Docker 빌드 및 push (SHA 태그 + latest 태그)
      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          IMAGE_URI=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}
          SHORT_SHA=${{ steps.vars.outputs.short_sha }}

          docker build --platform linux/arm64 \
            -t $IMAGE_URI:$SHORT_SHA \
            -t $IMAGE_URI:latest .

          docker push $IMAGE_URI:$SHORT_SHA
          docker push $IMAGE_URI:latest

          echo "✅ Pushed: $IMAGE_URI:$SHORT_SHA (+ latest)"

  # ========== CD: EC2에 새 이미지 배포 ==========
  deploy:
    needs: build
    if: github.event_name == 'push'   # PR에서는 배포하지 않음
    runs-on: ubuntu-latest

    steps:
      # Step 1: AWS 자격증명 - OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 2: EC2에 배포 명령 전송 (SSM)
      - name: Deploy to EC2
        run: |
          REGISTRY=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
          IMAGE=$REGISTRY/${{ vars.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}

          aws ssm send-command \
            --instance-ids ${{ vars.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $IMAGE\",
              \"docker rm -f ci-demo || true\",
              \"docker run -d -p 8080:8080 --restart unless-stopped --name ci-demo -e SPRING_PROFILES_ACTIVE=prod $IMAGE\"
            ]"

          echo "✅ 배포 명령 전송 완료: $IMAGE"